:root {
  color-scheme: light;

  /* Palitra (berilgan andoza) */
  --navy: #054A91;
  --steel: #3E7CB1;
  --wisteria: #81A4CD;
  --alice: #DBE4EE;
  --orange: #F17300;

  /* Neytrallar: ko'k tomonga og'ishgan */
  --bg: #EDF2F8;
  --surface: #FFFFFF;
  --surface-2: #F5F8FC;
  --ink: #0B2340;
  --ink-2: #44597A;
  --ink-3: #7A8DA6;
  --line: #D2DDEA;

  /* Holat ranglari */
  --ok: #17924F;
  --ok-bg: #E4F4EA;
  --bad: #D2392E;
  --bad-bg: #FCE8E6;
  --accent-bg: #FFF2E6;

  /* Shriftlar */
  --font-display: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'Inter', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  /* O'lchamlar */
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  --shadow: 0 1px 2px rgba(11, 35, 64, .06), 0 8px 24px rgba(11, 35, 64, .06);
  --shadow-lg: 0 2px 4px rgba(11, 35, 64, .06), 0 20px 48px rgba(5, 74, 145, .14);
  --ring: 0 0 0 3px rgba(241, 115, 0, .35);
  --side-w: 19rem;
}

/* css/base.css */
/* Asos: reset, tipografiya, umumiy komponentlar (tugma, segment, kartochka). */
*, *::before, *::after { box-sizing: border-box; }

html {
  height: 100%;
  /* smart doska (1920px) ≈ 18.5px, noutbuk ≈ 15.5px */
  font-size: clamp(14px, 0.55vw + 8px, 20px);
  -webkit-text-size-adjust: 100%;
}

body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}

h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

.ic { width: 1.25em; height: 1.25em; flex: none; }

.app { height: 100%; }

.eyebrow {
  font-size: .8rem;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--orange);
}
.h2 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; }
.muted { color: var(--ink-2); }
.hint { font-size: .85rem; color: var(--ink-3); }
.hint.is-ok { color: var(--ok); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow);
}

/* ---------- Tugmalar ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .55rem;
  min-height: 2.9rem;
  padding: .65rem 1.15rem;
  border: 1.5px solid transparent;
  border-radius: var(--r-md);
  font-weight: 600;
  font-size: 1rem;
  line-height: 1.2;
  white-space: nowrap;
  transition: background-color .15s, border-color .15s, color .15s, transform .1s;
  user-select: none;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:focus-visible { outline: none; box-shadow: var(--ring); }
.btn:disabled { cursor: not-allowed; background: var(--alice); color: var(--ink-3); border-color: transparent; box-shadow: none; }

.btn--primary { background: var(--navy); color: #fff; }
.btn--primary:hover:not(:disabled) { background: var(--steel); }
.btn--accent { background: var(--orange); color: #fff; }
.btn--accent:hover:not(:disabled) { background: #D96700; }
.btn--ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn--ghost:hover:not(:disabled) { border-color: var(--orange); color: var(--navy); }
.btn--danger { background: var(--bad); color: #fff; }
.btn--lg { min-height: 3.5rem; padding: .85rem 1.4rem; font-size: 1.1rem; border-radius: var(--r-md); }
.btn--xl { min-height: 4rem; font-size: 1.15rem; border-radius: var(--r-lg); }
.btn--block { width: 100%; }
.btn--icon { width: 2.9rem; padding: 0; }
.btn.grow { flex: 1; min-width: 0; }
.btn b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Segment tanlagich ---------- */
.seg {
  display: inline-flex;
  padding: .25rem;
  gap: .25rem;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}
.seg__btn {
  min-width: 3.5rem;
  min-height: 2.75rem;
  padding: .4rem .9rem;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.seg__btn:hover:not(:disabled):not(.is-on) { color: var(--navy); background: var(--surface); }
.seg__btn.is-on { background: var(--navy); color: #fff; }
.seg__btn:disabled { cursor: not-allowed; opacity: .55; }
.seg__btn:focus-visible { outline: none; box-shadow: var(--ring); }
.seg--sm .seg__btn { min-width: 3rem; min-height: 2.4rem; font-size: .95rem; }

/* ---------- Belgilar ---------- */
.tag {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  padding: .35rem .8rem .35rem .6rem;
  border-radius: 999px;
  background: var(--alice);
  color: var(--navy);
  font-weight: 600;
  font-size: .9rem;
}
.ok { color: var(--ok); }
.bad { color: var(--bad); }
.skip { color: var(--ink-3); }

/* ---------- Animatsiya ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 50% { opacity: .55; } }
.enter > * { animation: rise .32s cubic-bezier(.2, .7, .2, 1) both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* css/screens.css */
/* Ekranlar: sozlash, qobiq, taxta, savol, natijalar. */

/* =========================== SOZLASH =========================== */
.app--setup {
  overflow-y: auto;
  background:
    radial-gradient(60rem 40rem at 105% -10%, rgba(129, 164, 205, .35), transparent 60%),
    radial-gradient(40rem 30rem at -10% 110%, rgba(219, 228, 238, .9), transparent 60%),
    var(--bg);
}
.setup {
  min-height: 100%;
  max-width: 88rem;
  margin: 0 auto;
  padding-block: 3rem;
  padding-left: max(2.5rem, env(safe-area-inset-left, 0px));
  padding-right: max(2.5rem, env(safe-area-inset-right, 0px));
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  gap: 4rem;
  align-items: center;
}
.setup__intro { display: grid; gap: 1.5rem; }
.setup__title {
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 3.6vw + 1rem, 5rem);
  line-height: 1;
  font-weight: 800;
  letter-spacing: -.035em;
  color: var(--navy);
  text-wrap: balance;
}
.setup__lead { font-size: 1.25rem; color: var(--ink-2); max-width: 34em; }

.rules { display: grid; gap: .9rem; }
.rules li { display: flex; gap: .9rem; align-items: center; font-size: 1.05rem; color: var(--ink-2); }
.rules li b { color: var(--ink); font-variant-numeric: tabular-nums; }
.rules .ic {
  width: 2.6rem; height: 2.6rem; padding: .6rem;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--navy);
}


.setup__card { padding: 2.5rem; display: grid; gap: 1.5rem; }
.setup__count { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.setup__fields { display: grid; gap: .8rem; }
.setup__fields .btn { margin-top: .6rem; }
.setup__fields .hint { text-align: center; }

.field {
  display: flex; align-items: center; gap: .8rem;
  animation: rise .3s both;
}
.field__num {
  width: 2.5rem; height: 2.5rem; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--alice); color: var(--navy);
  font-weight: 700;
}
.field__input {
  flex: 1; min-width: 0;
  min-height: 3.4rem;
  padding: .75rem 1rem;
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  font-size: 1.15rem; font-weight: 500;
  transition: border-color .15s, box-shadow .15s;
}
.field__input::placeholder { color: var(--ink-3); font-weight: 400; }
.field__input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 4px rgba(5, 74, 145, .12); }

/* =========================== QOBIQ =========================== */
.app--game { display: grid; grid-template-rows: auto minmax(0, 1fr); }

.bar {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 2rem;
  padding-block: .8rem;
  padding-left: max(1.5rem, env(safe-area-inset-left, 0px));
  padding-right: max(1.5rem, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: .8rem; min-width: 0; }
.brand__mark {
  width: 2.75rem; height: 2.75rem; flex: none;
  overflow: hidden;
  border-radius: var(--r-md);
  /* boshning orqasida yumshoq oq yorug'lik, yuz fondan ajralib tursin */
  background:
    radial-gradient(circle at 50% 42%, rgba(255,255,255,.55) 0, rgba(255,255,255,.2) 34%, rgba(255,255,255,0) 60%),
    #1f6fd1;
}
/* Imzo-avatar: tana qimirlamaydi, faqat bosh bo'yin atrofida o'ngdan chapga to'xtovsiz tebranadi */
.avatar {
  position: relative; display: block;
  width: 100%; aspect-ratio: 277 / 367;
  margin-top: -9.75%;
}
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.avatar__head {
  transform-origin: 50.54% 67.03%;   /* bo'yin asosi */
  /* faqat chetlarda sekinlashadi, o'rtadan to'xtamay o'tadi (mayatnik) */
  animation: head-sway 2.5s ease-in-out infinite alternate;
}
@keyframes head-sway {
  from { transform: rotate(6deg); }
  to   { transform: rotate(-6deg); }
}
@media (prefers-reduced-motion: reduce) {
  .avatar__head { animation: none; }
}
.brand__text { display: grid; line-height: 1.2; }
.brand__text b { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: -.01em; }
.brand__text small { font-size: .8rem; color: var(--ink-3); }

.bar__progress { display: flex; align-items: center; gap: .9rem; justify-self: center; width: min(26rem, 100%); }
.bar__count { font-variant-numeric: tabular-nums; color: var(--ink-3); white-space: nowrap; font-size: .95rem; }
.bar__count b { color: var(--ink); }
.meter { flex: 1; height: .5rem; border-radius: 999px; background: var(--alice); overflow: hidden; }
.meter__fill { display: block; height: 100%; border-radius: inherit; background: var(--navy); transition: width .4s ease; }
.bar__actions { display: flex; gap: .6rem; justify-content: flex-end; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) var(--side-w); min-height: 0; }
.stage {
  min-width: 0; min-height: 0;
  overflow-y: auto;
  padding: 1.5rem;
  padding-left: max(1.5rem, env(safe-area-inset-left, 0px));
}

.side {
  min-height: 0;
  overflow-y: auto;
  padding: 1.5rem 1.25rem;
  padding-right: max(1.25rem, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-left: 1px solid var(--line);
  display: grid; align-content: start; gap: 1rem;
}
.side__title { display: flex; align-items: center; gap: .5rem; font-size: .85rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.teams { display: grid; gap: .75rem; }
.team {
  padding: 1rem 1.1rem;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface-2);
  display: grid; gap: .35rem;
  transition: background-color .25s, border-color .25s;
}
.team__top { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.team__name { font-weight: 600; font-size: 1rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team__balance { font-family: var(--font-display); font-size: 2rem; font-weight: 700; letter-spacing: -.02em; color: var(--navy); font-variant-numeric: tabular-nums; line-height: 1.15; }
.team__balance.is-neg { color: var(--bad); }
.team__stats { display: flex; gap: .9rem; font-size: .9rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.team__stats span { display: inline-flex; align-items: center; gap: .2rem; }
.team__stats .ic { width: 1rem; height: 1rem; }

.status { display: inline-flex; align-items: center; gap: .35rem; font-size: .75rem; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
.status i { width: .55rem; height: .55rem; border-radius: 50%; }
.status--wait i { background: var(--orange); }
.status--play i { background: #3DDC84; box-shadow: 0 0 0 3px rgba(61, 220, 132, .25); animation: pulse 1.6s ease-in-out infinite; }

.team.is-active { background: var(--navy); border-color: var(--navy); color: #fff; box-shadow: var(--shadow-lg); }
.team.is-active .team__balance { color: #fff; }
.team.is-active .team__balance.is-neg { color: #FFC2BC; }
.team.is-active .status { color: rgba(255, 255, 255, .85); }
.team.is-active .ok, .team.is-active .bad, .team.is-active .skip { color: rgba(255, 255, 255, .85); }

/* =========================== TAXTA =========================== */
.board-screen { height: 100%; display: flex; flex-direction: column; gap: 1.25rem; }
.turn {
  margin: 0;
  font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1;
  color: var(--navy);
  overflow-wrap: anywhere;
}

.board-wrap { flex: 1; min-height: 0; }
.board {
  height: 100%;
  min-height: 30rem;
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  gap: .75rem;
}
.col { display: grid; grid-template-rows: auto repeat(5, minmax(4.25rem, 1fr)); gap: .6rem; min-width: 0; }
.col__head {
  display: grid; justify-items: center; align-content: start; gap: .45rem;
  min-height: 7.2rem;
  padding: .9rem .5rem .8rem;
  text-align: center;
  border-radius: var(--r-lg);
  background: var(--navy);
  color: #fff;
}
.col__icon { width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border-radius: var(--r-md); background: rgba(255, 255, 255, .12); }
.col__icon .ic { width: 1.4rem; height: 1.4rem; }
.col__title { font-weight: 700; font-size: 1rem; line-height: 1.2; text-wrap: balance; }
.col__soon { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.col--off .col__head { background: transparent; color: var(--ink-3); border: 1.5px dashed var(--line); }
.col--off .col__icon { background: var(--surface-2); }

.cell {
  min-width: 0;
  display: grid; place-items: center; align-content: center; gap: .25rem;
  padding: .4rem;
  border-radius: var(--r-md);
  font-variant-numeric: tabular-nums;
}
.cell--open {
  border: 1.5px solid var(--line);
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(11, 35, 64, .05);
  transition: border-color .15s, background-color .15s, transform .1s;
}
.cell--open .cell__value { font-family: var(--font-display); font-size: clamp(1.4rem, 1.2vw + .6rem, 2.1rem); font-weight: 800; letter-spacing: -.02em; color: var(--navy); }
.cell--open:hover { border-color: var(--orange); background: var(--accent-bg); }
.cell--open:active { transform: scale(.97); }
.cell--open:focus-visible { outline: none; box-shadow: var(--ring); border-color: var(--orange); }

.cell--used { background: var(--alice); border: 1.5px solid transparent; color: var(--ink-3); }
.cell--used .cell__value { font-size: 1rem; font-weight: 700; text-decoration: line-through; text-decoration-thickness: 1.5px; }
.cell__who { display: inline-flex; align-items: center; gap: .25rem; max-width: 100%; font-size: .78rem; font-weight: 600; color: var(--ink-2); }
.cell__who > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell__who .ic { width: 1rem; height: 1rem; }
.cell--correct .cell__who .ic { color: var(--ok); }
.cell--wrong .cell__who .ic { color: var(--bad); }

.cell--off { border: 1.5px dashed var(--line); color: var(--ink-3); font-weight: 600; opacity: .7; }

/* =========================== SAVOL =========================== */
.q-screen {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(22rem, 26rem);
  gap: 1.5rem;
  align-items: start;
}
.q-main {
  min-width: 0;
  padding: 1.75rem 2rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem;
}
.q-meta { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.q-value { font-family: var(--font-display); font-size: 2rem; font-weight: 800; color: var(--orange); letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.q-team { margin-left: auto; font-weight: 600; color: var(--ink-3); }
.q-title { font-family: var(--font-display); font-size: clamp(1.7rem, 1.3vw + 1rem, 2.4rem); font-weight: 800; letter-spacing: -.025em; line-height: 1.12; color: var(--navy); text-wrap: balance; }

.q-body { display: grid; gap: .7rem; font-size: 1.15rem; line-height: 1.55; color: var(--ink-2); max-width: 62em; }
.q-list { display: grid; gap: .4rem; }
.q-list li { position: relative; padding-left: 1.3rem; }
.q-list li::before { content: ""; position: absolute; left: .2rem; top: .7em; width: .45rem; height: .45rem; border-radius: 50%; background: var(--orange); }
.q-cards { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: .75rem; }
.q-card { padding: .85rem 1rem; border-radius: var(--r-lg); background: var(--surface-2); border: 1px solid var(--line); }
.q-card h4 { font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); margin-bottom: .45rem; }
.q-card ul { display: grid; gap: .3rem; font-size: 1.05rem; line-height: 1.4; }
.q-card li:first-child { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

.q-ask { font-size: 1.3rem; font-weight: 650; line-height: 1.45; color: var(--ink); max-width: 56em; }

.opts { display: grid; gap: .6rem; }
.opt {
  display: flex; align-items: center; gap: 1rem;
  width: 100%;
  min-height: 3.9rem;
  padding: .7rem 1rem;
  text-align: left;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--r-lg);
  transition: border-color .15s, background-color .15s, opacity .2s;
}
.opt:hover:not(:disabled) { border-color: var(--wisteria); background: var(--surface-2); }
.opt:focus-visible { outline: none; box-shadow: var(--ring); }
.opt:disabled { cursor: default; }
.opt__key {
  width: 2.75rem; height: 2.75rem; flex: none;
  display: grid; place-items: center;
  border-radius: var(--r-md);
  background: var(--alice); color: var(--navy);
  font-weight: 800; font-size: 1.2rem;
  transition: background-color .15s, color .15s;
}
.opt__text { flex: 1; min-width: 0; font-size: 1.2rem; font-weight: 500; line-height: 1.35; font-variant-numeric: tabular-nums; }
.opt__mark { width: 2.2rem; height: 2.2rem; flex: none; display: grid; place-items: center; border-radius: 50%; color: #fff; }

.opt.is-selected { border-color: var(--orange); background: var(--accent-bg); }
.opt.is-selected .opt__key { background: var(--orange); color: #fff; }
.opt.is-correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.is-correct .opt__key, .opt.is-correct .opt__mark { background: var(--ok); color: #fff; }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.is-wrong .opt__key, .opt.is-wrong .opt__mark { background: var(--bad); color: #fff; }
.opt.is-dim { opacity: .5; }

.confirm { display: flex; justify-content: flex-end; }

/* ----- o'ng panel ----- */
.q-side { position: sticky; top: 0; min-width: 0; }
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: 1.5rem;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.25rem;
}
.panel__foot { display: grid; gap: .6rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
.panel__foot .hint { text-align: center; }
.panel__actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .6rem; padding-top: .25rem; }
.panel__actions .btn { min-height: 3.5rem; }

/* Taymer */
.timer { display: grid; gap: 1.25rem; justify-items: center; }
.timer__dial { position: relative; width: min(15rem, 100%); aspect-ratio: 1; max-width: 100%; }
.timer__dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer__track { fill: none; stroke: var(--alice); stroke-width: 9; }
.timer__bar { fill: none; stroke: var(--navy); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .2s linear, stroke .3s; }
.timer__read { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: .2rem; }
.timer__time { font-family: var(--font-display); font-size: 3.6rem; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
.timer__label { font-size: .8rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.timer__controls { width: 100%; display: grid; gap: .75rem; }
.timer__main { width: 100%; }
.timer__row { display: flex; justify-content: space-between; align-items: center; gap: .75rem; }

.timer[data-status="paused"] .timer__time { color: var(--ink-2); }
.timer.is-warn .timer__bar { stroke: var(--orange); }
.timer.is-warn .timer__time { color: var(--orange); animation: pulse 1s ease-in-out infinite; }
.timer[data-status="done"] .timer__time,
.timer[data-status="done"] .timer__label { color: var(--orange); }
.timer[data-status="done"] .timer__track { stroke: var(--accent-bg); }
.timer[data-status="done"] .timer__dial { animation: rise .3s both; }

/* Natija */
.result {
  display: flex; align-items: center; gap: .9rem;
  padding: 1rem 1.1rem;
  border-radius: var(--r-lg);
}
.result__icon { width: 3rem; height: 3rem; flex: none; display: grid; place-items: center; border-radius: 50%; color: #fff; }
.result__icon .ic { width: 1.6rem; height: 1.6rem; stroke-width: 2.2; }
.result__text { display: grid; min-width: 0; line-height: 1.2; }
.result__label { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
.result__team { font-size: .9rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result__amount { margin-left: auto; font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.result--correct { background: var(--ok-bg); color: var(--ok); }
.result--correct .result__icon { background: var(--ok); }
.result--wrong { background: var(--bad-bg); color: var(--bad); }
.result--wrong .result__icon { background: var(--bad); }
.result--skip { background: var(--surface-2); color: var(--ink-2); }
.result--skip .result__icon { background: var(--ink-3); }

.answer { display: grid; gap: .3rem; }
.answer__key { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ok); }
.answer__short { font-size: 1.2rem; font-weight: 650; line-height: 1.4; font-variant-numeric: tabular-nums; }

.note { display: grid; gap: .5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.note__head { display: flex; align-items: center; gap: .45rem; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); }
.note__head .ic { color: var(--orange); }
.note__body {
  position: relative;
  display: grid; gap: .55rem;
  max-height: 7.6em;
  overflow: hidden;
  font-size: 1rem; line-height: 1.5; color: var(--ink-2);
}
.note__body::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 2.4em;
  background: linear-gradient(rgba(255, 255, 255, 0), var(--surface));
  pointer-events: none;
}

  <script>
/* js/core/config.js */
/* O'yin sozlamalari. Raqamlarni faqat shu yerda o'zgartiring. */
(function (MS) {
  'use strict';

  MS.config = Object.freeze({
    startCapital: 100,               // har jamoaning boshlang'ich kapitali, $
    teamCounts: [3, 4, 5],
    defaultTeamCount: 3,
    values: [100, 200, 300, 400, 500], // har mavzudagi savol qiymatlari (tartib bilan)
    letters: ['A', 'B', 'C'],
    timer: Object.freeze({
      short: 60,      // 100–300 $ savollar
      long: 90,       // 400–500 $ savollar
      longFrom: 400,  // shu qiymatdan boshlab uzun taymer
      warnAt: 10      // oxirgi necha soniyada ogohlantirish rangi
    }),
    historyLimit: 30,                // "Bekor qilish" uchun saqlanadigan qadamlar
    storageKey: 'moliyaviy-oyin:v1'
  });
})(window.MS = window.MS || {});

/* js/core/registry.js */
/* Mavzular reyestri: manifestdagi o'rinlar + data/topics/*.js fayllari.
   Mavzu fayli MS.registry.registerTopic({...}) ni chaqiradi. */
(function (MS) {
  'use strict';

  const C = MS.config;
  const slots = [];
  const topics = new Map();

  function defineSlots(list) {
    list.forEach((s) => slots.push(Object.freeze(Object.assign({}, s))));
  }

  function validate(t) {
    const errors = [];
    if (!t || !t.id) return ['mavzu id si yo‘q'];
    if (!Array.isArray(t.questions) || t.questions.length !== C.values.length) {
      errors.push(`${C.values.length} ta savol bo‘lishi kerak`);
      return errors;
    }
    t.questions.forEach((q, i) => {
      const n = `${i + 1}-savol`;
      if (q.value !== C.values[i]) errors.push(`${n}: qiymat ${C.values[i]} bo‘lishi kerak`);
      if (!Array.isArray(q.options) || q.options.length !== C.letters.length) errors.push(`${n}: 3 ta variant kerak`);
      if (!C.letters.includes(q.answer)) errors.push(`${n}: to‘g‘ri javob A, B yoki C bo‘lishi kerak`);
      if (!q.title || !q.ask) errors.push(`${n}: sarlavha yoki savol matni yo‘q`);
    });
    return errors;
  }

  function registerTopic(t) {
    const errors = validate(t);
    if (errors.length) {
      console.error(`[Mavzu "${t && t.id}"] o‘tkazib yuborildi:\n- ` + errors.join('\n- '));
      return;
    }
    if (!slots.some((s) => s.id === t.id)) {
      console.warn(`[Mavzu "${t.id}"] manifestda (data/topics.js) o‘rni yo‘q.`);
      return;
    }
    topics.set(t.id, Object.freeze(t));
  }

  function list() {
    return slots
      .slice()
      .sort((a, b) => a.order - b.order)
      .map((s) => {
        const t = topics.get(s.id);
        return {
          id: s.id,
          order: s.order,
          icon: s.icon,
          title: (t && t.title) || s.title || `${s.order}-mavzu`,
          ready: Boolean(t),
          questions: t ? t.questions : null
        };
      });
  }

  const qid = (topicId, value) => `${topicId}:${value}`;

  function find(id) {
    const [topicId, value] = String(id).split(':');
    const t = topics.get(topicId);
    if (!t) return null;
    const q = t.questions.find((x) => x.value === Number(value));
    return q ? { topic: t, q } : null;
  }

  function allQids() {
    const out = [];
    topics.forEach((t) => t.questions.forEach((q) => out.push(qid(t.id, q.value))));
    return out;
  }

  MS.registry = { defineSlots, registerTopic, list, find, qid, allQids };
})(window.MS);

/* js/core/store.js */
/* O'yin holati: yagona manba, barcha o'zgarishlar shu yerdagi amallar orqali.
   Holat har amaldan keyin brauzerda saqlanadi (sahifa yangilansa tiklanadi). */
(function (MS) {
  'use strict';

  const C = MS.config;
  const R = MS.registry;
  const listeners = new Set();

  const fresh = () => ({
    v: 1,
    phase: 'setup',      // setup | board | question | results
    teams: [],           // [{ name, balance, correct, wrong, skipped }]
    current: 0,          // navbatdagi jamoa indeksi
    used: {},            // qid -> { team, outcome }
    active: null,        // { qid, selected, outcome, delta }
    history: [],         // "Bekor qilish" uchun nusxalar
    finished: false
  });

  let state = fresh();

  /* ---------- saqlash ---------- */
  function save() {
    try { localStorage.setItem(C.storageKey, JSON.stringify(state)); } catch (e) { /* saqlash mumkin emas */ }
  }

  function load() {
    try {
      const raw = localStorage.getItem(C.storageKey);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || s.v !== 1 || !Array.isArray(s.teams) || !s.teams.length) return null;
      if (s.active && !R.find(s.active.qid)) { s.active = null; s.phase = 'board'; }
      return Object.assign(fresh(), s);
    } catch (e) { return null; }
  }

  function clear() {
    try { localStorage.removeItem(C.storageKey); } catch (e) { /* e'tiborsiz */ }
  }

  /* ---------- obuna ---------- */
  function commit(patch) {
    state = Object.assign({}, state, patch);
    save();
    listeners.forEach((fn) => fn(state));
  }

  const subscribe = (fn) => { listeners.add(fn); return () => listeners.delete(fn); };
  const get = () => state;

  /* ---------- hisob-kitob yordamchilari ---------- */
  function remaining(s = state) {
    return R.allQids().filter((id) => !s.used[id]).length;
  }

  function snapshot() {
    return JSON.stringify({ teams: state.teams, used: state.used, active: state.active });
  }

  /* ---------- amallar ---------- */
  const actions = {
    init() {
      const saved = load();
      if (saved) state = saved;
      listeners.forEach((fn) => fn(state));
    },

    startGame(names) {
      const teams = names.map((name) => ({
        name, balance: C.startCapital, correct: 0, wrong: 0, skipped: 0
      }));
      state = Object.assign(fresh(), { phase: 'board', teams });
      commit({});
    },

    openQuestion(qid) {
      if (state.phase !== 'board' || state.used[qid] || !R.find(qid)) return;
      commit({ phase: 'question', active: { qid, selected: null, outcome: null, delta: 0 } });
    },

    closeQuestion() {
      if (state.phase !== 'question' || !state.active || state.active.outcome) return;
      commit({ phase: 'board', active: null });
    },

    select(letter) {
      const a = state.active;
      if (!a || a.outcome || !C.letters.includes(letter)) return;
      commit({ active: Object.assign({}, a, { selected: a.selected === letter ? null : letter }) });
    },

    confirm() {
      const a = state.active;
      if (!a || a.outcome || !a.selected) return;
      const { q } = R.find(a.qid);
      resolve(a.selected === q.answer ? 'correct' : 'wrong');
    },

    skip() {
      const a = state.active;
      if (!a || a.outcome) return;
      resolve('skip');
    },

    undo() {
      const a = state.active;
      if (!a || !a.outcome || !state.history.length) return;
      const history = state.history.slice();
      const prev = JSON.parse(history.pop());
      commit({
        teams: prev.teams,
        used: prev.used,
        active: Object.assign({}, prev.active, { selected: a.selected, outcome: null, delta: 0 }),
        history
      });
    },

    next() {
      if (!state.active || !state.active.outcome) return;
      const n = state.teams.length;
      const current = (state.current + 1) % n;
      const left = remaining();
      // Barcha jamoalar teng marta o'ynashi uchun: yangi raund boshida savol yetmasa, o'yin tugaydi.
      const finished = left === 0 || (current === 0 && left < n);
      commit({ current, active: null, phase: finished ? 'results' : 'board', finished });
    },

    showResults() {
      if (state.phase === 'board') commit({ phase: 'results' });
    },

    backToBoard() {
      if (state.phase === 'results' && !state.finished) commit({ phase: 'board' });
    },

    reset() {
      clear();
      state = fresh();
      listeners.forEach((fn) => fn(state));
    }
  };

  function resolve(outcome) {
    const a = state.active;
    const { q } = R.find(a.qid);
    const delta = outcome === 'correct' ? q.value : outcome === 'wrong' ? -q.value : 0;
    const history = state.history.concat(snapshot()).slice(-C.historyLimit);

    const teams = state.teams.map((t, i) => {
      if (i !== state.current) return t;
      const key = outcome === 'correct' ? 'correct' : outcome === 'wrong' ? 'wrong' : 'skipped';
      return Object.assign({}, t, { balance: t.balance + delta, [key]: t[key] + 1 });
    });

    const used = Object.assign({}, state.used, { [a.qid]: { team: state.current, outcome } });
    commit({ teams, used, history, active: Object.assign({}, a, { outcome, delta }) });
  }

  MS.store = { get, subscribe, actions, remaining };
})(window.MS);

/* js/ui/dom.js */
/* Kichik DOM va format yordamchilari. */
(function (MS) {
  'use strict';

  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ESC[c]);

  const group = (n) => String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

  /* 1250 -> "$1 250", -150 -> "−$150" */
  const money = (n) => (n < 0 ? '−' : '') + '$' + group(n);

  /* +300 / −300 / 0 */
  const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + '$' + group(n);

  const clock = (sec) => {
    const s = Math.max(0, Math.ceil(sec));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  MS.dom = { esc, money, signed, clock, $, $$ };
})(window.MS);

/* js/ui/timer.js */
/* Taymer: moderator boshqaradi. Holat DOM dan alohida saqlanadi,
   shuning uchun ekran qayta chizilsa ham vaqt yo'qolmaydi.
   0 ga yetganda to'xtaydi va "Vaqt tugadi" ko'rsatadi; ball avtomatik ayrilmaydi. */
(function (MS) {
  'use strict';

  const { clock } = MS.dom;
  const T = MS.config.timer;
  const R = 52;
  const LEN = 2 * Math.PI * R;

  let duration = T.short;
  let remaining = T.short;
  let status = 'idle';     // idle | running | paused | done
  let endAt = 0;
  let tid = 0;
  let root = null;
  let lastBeep = 0;        // oxirgi signal berilgan soniya (takrorlanmasin)

  /* ---------- ovoz: oxirgi 5 soniyada har soniyada "tiyt" ---------- */
  const BEEP_FROM = 5;
  let audio = null;

  function unlockAudio() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audio) audio = new Ctx();
    if (audio.state === 'suspended') audio.resume();
  }

  function beep() {
    if (!audio) return;
    const t = audio.currentTime;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = 'square';
    osc.frequency.value = 1000;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + 0.16);
  }

  function countdownBeep() {
    const sec = Math.ceil(remaining);
    if (sec >= 1 && sec <= BEEP_FROM && sec !== lastBeep) {
      lastBeep = sec;
      beep();
    }
  }

  const durationFor = (value) => (value >= T.longFrom ? T.long : T.short);

  function stopTicking() { clearInterval(tid); tid = 0; }

  function prepare(seconds) {
    stopTicking();
    duration = seconds;
    remaining = seconds;
    status = 'idle';
    lastBeep = 0;
    paint();
  }

  function tick() {
    remaining = Math.max(0, (endAt - Date.now()) / 1000);
    if (remaining <= 0) { stopTicking(); status = 'done'; }
    else countdownBeep();
    paint();
  }

  function start() {
    if (status === 'running') return;
    if (status === 'done') { remaining = duration; lastBeep = 0; }
    unlockAudio();
    endAt = Date.now() + remaining * 1000;
    status = 'running';
    stopTicking();
    tid = setInterval(tick, 200);
    paint();
  }

  function pause() {
    if (status !== 'running') return;
    remaining = Math.max(0, (endAt - Date.now()) / 1000);
    stopTicking();
    status = 'paused';
    paint();
  }

  const toggle = () => (status === 'running' ? pause() : start());
  const reset = () => prepare(duration);
  const setDuration = (s) => { if (status !== 'running') prepare(s); };
  const freeze = () => pause();

  /* ---------- ko'rinish ---------- */
  const LABEL = { idle: 'Tayyor', running: 'Vaqt ketmoqda', paused: 'To‘xtatildi', done: 'Vaqt tugadi' };
  const MAIN = {
    idle: ['play', 'Vaqtni boshlash'],
    running: ['pause', 'Pauza'],
    paused: ['play', 'Davom ettirish'],
    done: ['refresh', 'Qayta boshlash']
  };

  function markup() {
    return `
      <div class="timer" data-timer>
        <div class="timer__dial">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="timer__track" cx="60" cy="60" r="${R}"/>
            <circle class="timer__bar" data-t="bar" cx="60" cy="60" r="${R}" stroke-dasharray="${LEN.toFixed(2)}"/>
          </svg>
          <div class="timer__read">
            <span class="timer__time" data-t="time">0:00</span>
            <span class="timer__label" data-t="label"></span>
          </div>
        </div>
        <div class="timer__controls">
          <button class="btn btn--primary btn--lg timer__main" data-action="timer-toggle" data-t="main"></button>
          <div class="timer__row">
            <div class="seg seg--sm" role="group" aria-label="Taymer davomiyligi">
              <button class="seg__btn" data-action="timer-set" data-sec="${T.short}" data-t="dur">${clock(T.short)}</button>
              <button class="seg__btn" data-action="timer-set" data-sec="${T.long}" data-t="dur">${clock(T.long)}</button>
            </div>
            <button class="btn btn--ghost btn--icon" data-action="timer-reset" aria-label="Taymerni qaytarish" title="Qaytarish">${MS.icon('reset')}</button>
          </div>
        </div>
      </div>`;
  }

  function mount(node) { root = node; paint(); }

  function paint() {
    if (!root || !root.isConnected) return;
    const q = (k) => root.querySelector(`[data-t="${k}"]`);
    const warn = status === 'running' && Math.ceil(remaining) <= T.warnAt;
    const box = root.querySelector('[data-timer]');
    box.dataset.status = status;
    box.classList.toggle('is-warn', warn);

    q('bar').style.strokeDashoffset = (LEN * (1 - remaining / duration)).toFixed(2);
    q('time').textContent = clock(remaining);
    q('label').textContent = LABEL[status];

    const [ic, text] = MAIN[status];
    q('main').innerHTML = `${MS.icon(ic)}<span>${text}</span>`;

    root.querySelectorAll('[data-t="dur"]').forEach((b) => {
      const on = Number(b.dataset.sec) === duration;
      b.classList.toggle('is-on', on);
      b.disabled = status === 'running';
      b.setAttribute('aria-pressed', String(on));
    });
  }

  MS.timer = { durationFor, prepare, start, pause, toggle, reset, setDuration, freeze, markup, mount };
})(window.MS);

/* js/screens/setup.js */
/* Sozlash ekrani: jamoalar soni va nomlari. */
(function (MS) {
  'use strict';

  const C = MS.config;
  const { esc, money } = MS.dom;

  const ui = { count: C.defaultTeamCount, names: [] };

  function render() {
    const inputs = Array.from({ length: ui.count }, (_, i) => `
      <label class="field" for="team-${i}">
        <span class="field__num">${i + 1}</span>
        <input id="team-${i}" class="field__input" type="text" maxlength="24" autocomplete="off"
               placeholder="${i + 1}-jamoa nomi" value="${esc(ui.names[i] || '')}" data-input="team" data-index="${i}">
      </label>`).join('');

    const counts = C.teamCounts.map((n) => `
      <button class="seg__btn${n === ui.count ? ' is-on' : ''}" data-action="team-count" data-n="${n}" aria-pressed="${n === ui.count}">${n}</button>`).join('');

    return `
      <main class="setup">
        <section class="setup__intro">
          <p class="eyebrow">Intellektual o‘yin</p>
          <h1 class="setup__title">Moliyaviy savodxonlik</h1>
          <p class="setup__lead">Maqsad — moliyaviy bilimingiz bilan eng ko‘p pul yig‘ish. O‘yin oxirida balansi eng katta jamoa g‘olib bo‘ladi.</p>
          <ul class="rules">
            <li>${MS.icon('wallet')}<span>Har bir jamoa <b>${money(C.startCapital)}</b> bilan boshlaydi. Navbat kelganda mavzu va savol qiymatini o‘zingiz tanlaysiz.</span></li>
            <li>${MS.icon('grid')}<span>To‘g‘ri javob uchun savol qiymati balansga <b>qo‘shiladi</b>, xato javob uchun <b>ayriladi</b>. Qiymat qancha katta bo‘lsa, xavf ham shuncha katta.</span></li>
            <li>${MS.icon('clock')}<span>Har bir savolga <b>${C.timer.short / 60}:00</b> yoki <b>${Math.floor(C.timer.long / 60)}:${String(C.timer.long % 60).padStart(2, '0')}</b> vaqt beriladi. Jamoa bilan maslahatlashib, shu vaqt ichida javob bering.</span></li>
          </ul>
        </section>

        <section class="setup__card card">
          <h2 class="h2">Jamoalar</h2>
          <div class="setup__count">
            <span class="muted">Jamoalar soni</span>
            <div class="seg" role="group" aria-label="Jamoalar soni">${counts}</div>
          </div>
          <form class="setup__fields" data-form="setup" novalidate>
            ${inputs}
            <button type="submit" class="btn btn--accent btn--xl btn--block" data-t="start" disabled>
              <span>O‘yinni boshlash</span>${MS.icon('arrowRight')}
            </button>
            <p class="hint" data-t="hint">Barcha jamoalar nomini kiriting</p>
          </form>
        </section>
      </main>`;
  }

  function names() {
    return Array.from({ length: ui.count }, (_, i) => (ui.names[i] || '').trim());
  }

  function validate(root) {
    const list = names();
    const filled = list.every(Boolean);
    const unique = new Set(list.map((n) => n.toLowerCase())).size === list.length;
    const btn = root.querySelector('[data-t="start"]');
    const hint = root.querySelector('[data-t="hint"]');
    btn.disabled = !(filled && unique);
    hint.textContent = !filled ? 'Barcha jamoalar nomini kiriting' : !unique ? 'Jamoa nomlari takrorlanmasligi kerak' : 'Tayyor';
    hint.classList.toggle('is-ok', filled && unique);
    return filled && unique;
  }

  function mount(root) {
    validate(root);
    const form = root.querySelector('[data-form="setup"]');
    form.addEventListener('input', (e) => {
      const el = e.target.closest('[data-input="team"]');
      if (!el) return;
      ui.names[Number(el.dataset.index)] = el.value;
      validate(root);
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (validate(root)) MS.store.actions.startGame(names());
    });
    const first = root.querySelector('#team-0');
    if (first && !first.value) first.focus({ preventScroll: true });
  }

  function setCount(n) {
    ui.count = n;
  }

  MS.screens = MS.screens || {};
  MS.screens.setup = { render, mount, setCount };
})(window.MS);

/* js/screens/shell.js */
/* O'yin qobig'i: yuqori panel va jamoalar paneli (barcha o'yin ekranlari uchun umumiy). */
(function (MS) {
  'use strict';

  const { esc, money } = MS.dom;

  function header(s) {
    const total = MS.registry.allQids().length;
    const left = MS.store.remaining(s);
    const canBack = s.phase === 'question' && s.active && !s.active.outcome;

    let actions = '';
    if (canBack) {
      actions += `<button class="btn btn--ghost" data-action="close-question">${MS.icon('arrowLeft')}<span>Taxtaga qaytish</span></button>`;
    } else if (s.phase === 'board') {
      actions += `<button class="btn btn--ghost" data-action="show-results">${MS.icon('bars')}<span>Natijalar</span></button>`;
    } else if (s.phase === 'results' && !s.finished) {
      actions += `<button class="btn btn--ghost" data-action="back-board">${MS.icon('grid')}<span>Taxtaga qaytish</span></button>`;
    }
    actions += `<button class="btn btn--ghost btn--icon" data-action="fullscreen" aria-label="To‘liq ekran" title="To‘liq ekran">${MS.icon('expand')}</button>`;

    return `
      <header class="bar">
        <div class="brand">
          <span class="brand__mark"><span class="avatar" aria-hidden="true"><img src="assets/avatar-body.webp" alt="" width="1108" height="1468"><img class="avatar__head" src="assets/avatar-head.webp" alt="" width="1108" height="1468"></span></span>
          <span class="brand__text"><b>Moliyaviy savodxonlik</b><small>Intellektual o‘yin</small></span>
        </div>
        <div class="bar__progress" title="Qolgan savollar">
          <span class="bar__count"><b>${total - left}</b> / ${total}</span>
          <span class="meter"><span class="meter__fill" style="width:${total ? ((total - left) / total) * 100 : 0}%"></span></span>
        </div>
        <div class="bar__actions">${actions}</div>
      </header>`;

  function teams(s) {
    const cards = s.teams.map((t, i) => {
      const active = i === s.current && !s.finished;
      return `
        <li class="team${active ? ' is-active' : ''}">
          <div class="team__top">
            <span class="team__name">${esc(t.name)}</span>
            <span class="status ${active ? 'status--play' : 'status--wait'}"><i></i>${active ? 'O‘ynayapti' : 'Kutmoqda'}</span>
          </div>
          <div class="team__balance${t.balance < 0 ? ' is-neg' : ''}">${money(t.balance)}</div>
          <div class="team__stats">
            <span class="ok">${MS.icon('check')}${t.correct}</span>
            <span class="bad">${MS.icon('x')}${t.wrong}</span>
            ${t.skipped ? `<span class="skip">${MS.icon('minus')}${t.skipped}</span>` : ''}
          </div>
        </li>`;
    }).join('');

    return `
      <aside class="side">
        <h2 class="side__title">${MS.icon('users')}<span>Jamoalar</span></h2>
        <ol class="teams">${cards}</ol>
      </aside>`;
  }

  MS.screens = MS.screens || {};
  MS.screens.shell = { header, teams };
})(window.MS);

/* js/screens/board.js */
/* O'yin taxtasi: mavzular ustunlarda, qiymatlar qatorlarda. */
(function (MS) {
  'use strict';

  const C = MS.config;
  const { esc } = MS.dom;
  const OUT_ICON = { correct: 'check', wrong: 'x', skip: 'minus' };

  function cell(topic, value, s) {
    if (!topic.ready) {
      return `<div class="cell cell--off" aria-hidden="true">$${value}</div>`;
    }
    const id = MS.registry.qid(topic.id, value);
    const used = s.used[id];
    if (used) {
      const team = s.teams[used.team];
      return `
        <div class="cell cell--used cell--${used.outcome}" title="${esc(team ? team.name : '')}">
          <span class="cell__value">$${value}</span>
          <span class="cell__who">${MS.icon(OUT_ICON[used.outcome])}<span>${esc(team ? team.name : '')}</span></span>
        </div>`;
    }
    return `<button class="cell cell--open" data-action="open" data-qid="${id}" aria-label="${esc(topic.title)}, ${value} dollar"><span class="cell__value">$${value}</span></button>`;
  }

  function render(s) {
    const topics = MS.registry.list();
    const team = s.teams[s.current];

    const cols = topics.map((t) => `
      <div class="col${t.ready ? '' : ' col--off'}">
        <div class="col__head">
          <span class="col__icon">${MS.icon(t.ready ? t.icon : 'lock')}</span>
          <span class="col__title">${esc(t.title)}</span>
          ${t.ready ? '' : '<span class="col__soon">Tez orada</span>'}
        </div>
        ${C.values.map((v) => cell(t, v, s)).join('')}
      </div>`).join('');

    return `
      <section class="board-screen">
        <h2 class="turn">${esc(team ? team.name : '')}</h2>
        <div class="board-wrap">
          <div class="board" style="--cols:${topics.length}">${cols}</div>
        </div>
      </section>`;
  }

  MS.screens = MS.screens || {};
  MS.screens.board = { render };
})(window.MS);

/* js/screens/question.js */
/* Savol ekrani: chapda savol va variantlar, o'ngda taymer yoki natija. */
(function (MS) {
  'use strict';

  const C = MS.config;
  const { esc, signed } = MS.dom;

  /* ---------- matn bloklari ---------- */
  function block(b) {
    if (typeof b === 'string') return `<p>${esc(b)}</p>`;
    if (b.list) return `<ul class="q-list">${b.list.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
    if (b.cards) {
      return `<div class="q-cards" style="--n:${b.cards.length}">${b.cards.map((c) => `
        <div class="q-card">
          <h4>${esc(c.title)}</h4>
          <ul>${c.items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
        </div>`).join('')}</div>`;
    }
    if (b.calc) return `<div class="calc">${b.calc.map((x) => `<div>${esc(x)}</div>`).join('')}</div>`;
    return '';
  }

  function optionClass(letter, a, answer) {
    if (!a.outcome) return letter === a.selected ? ' is-selected' : '';
    if (letter === answer) return ' is-correct';
    if (letter === a.selected && a.outcome === 'wrong') return ' is-wrong';
    return ' is-dim';
  }

  function options(q, a) {
    const mark = { 'is-correct': 'check', 'is-wrong': 'x' };
    return q.options.map((text, i) => {
      const L = C.letters[i];
      const cls = optionClass(L, a, q.answer).trim();
      const ic = mark[cls] ? `<span class="opt__mark">${MS.icon(mark[cls])}</span>` : '';
      return `
        <button class="opt ${cls}" data-action="select" data-letter="${L}" ${a.outcome ? 'disabled' : ''} aria-pressed="${L === a.selected}">
          <span class="opt__key">${L}</span>
          <span class="opt__text">${esc(text)}</span>${ic}
        </button>`;
    }).join('');
  }

  /* ---------- o'ng panel: taymer ---------- */
  function controlPanel(a) {
    return `
      <div class="panel panel--timer">
        <div data-timer-root>${MS.timer.markup()}</div>
        <div class="panel__foot">
          <button class="btn btn--accent btn--lg btn--block" data-action="confirm" ${a.selected ? '' : 'disabled'}>
            ${MS.icon('check')}<span>${a.selected ? `${a.selected} javobni tasdiqlash` : 'Javobni tanlang'}</span>
          </button>
          <button class="btn btn--ghost btn--block" data-action="skip">${MS.icon('skip')}<span>Javobsiz yakunlash</span></button>
          <p class="hint">Vaqt tugasa ham javobni tanlash mumkin. Javob berilmasa, «Javobsiz» balansni o‘zgartirmaydi.</p>
        </div>
      </div>`;
  }

  /* ---------- o'ng panel: natija ---------- */
  const RESULT = {
    correct: ['check', 'To‘g‘ri!'],
    wrong: ['x', 'Noto‘g‘ri'],
    skip: ['minus', 'Javobsiz']
  };

  function clampBox(key, head, icon, inner) {
    return `
      <section class="note" data-clamp-box="${key}">
        <h3 class="note__head">${MS.icon(icon)}<span>${head}</span></h3>
        <div class="note__body" data-clamp>${inner}</div>
        <button class="more" data-action="expand" hidden><span>Batafsil</span>${MS.icon('chevronDown')}</button>
      </section>`;
  }

  function resultPanel(s, q, a) {
    const team = s.teams[s.current];
    const nextTeam = s.teams[(s.current + 1) % s.teams.length];
    const [ic, label] = RESULT[a.outcome];

    const explain = q.explain.map(block).join('');
    const terms = q.terms.map((t) => `
      <div class="term">
        <div class="term__name">${esc(t.name)}${t.en ? ` <span class="term__en">${esc(t.en)}</span>` : ''}</div>
        <p>${esc(t.def)}</p>
      </div>`).join('') + (q.note ? `<p class="term__note">${esc(q.note)}</p>` : '');

    return `
      <div class="panel panel--result">
        <div class="result result--${a.outcome}">
          <span class="result__icon">${MS.icon(ic)}</span>
          <div class="result__text">
            <span class="result__label">${label}</span>
            <span class="result__team">${esc(team.name)}</span>
          </div>
          <span class="result__amount">${signed(a.delta)}</span>
        </div>
        <div class="answer">
          <span class="answer__key">To‘g‘ri javob · ${q.answer}</span>
          <p class="answer__short">${esc(q.short)}</p>
        </div>
        ${clampBox('explain', 'Izoh', 'bulb', explain)}
        ${clampBox('terms', 'Xulosa', 'book', terms)}
        <div class="panel__actions">
          <button class="btn btn--ghost" data-action="undo" title="Oxirgi javobni bekor qilish">${MS.icon('undo')}<span>Bekor qilish</span></button>
          <button class="btn btn--primary btn--lg grow" data-action="next" title="Keyingi jamoa: ${esc(nextTeam.name)}">
            <span>Keyingi</span>${MS.icon('arrowRight')}
          </button>
        </div>
      </div>`;
  }

  /* ---------- ekran ---------- */
  function render(s) {
    const a = s.active;
    const found = MS.registry.find(a.qid);
    const { topic, q } = found;
    const slot = MS.registry.list().find((t) => t.id === topic.id);
    const team = s.teams[s.current];

    return `
      <section class="q-screen${a.outcome ? ' is-revealed' : ''}">
        <article class="q-main">
          <div class="q-meta">
            <span class="tag">${MS.icon(slot ? slot.icon : 'grid')}<span>${esc(topic.title)}</span></span>
            <span class="q-value">$${q.value}</span>
            <span class="q-team">${esc(team.name)}</span>
          </div>
          <h2 class="q-title">${esc(q.title)}</h2>
          <div class="q-body">${q.body.map(block).join('')}</div>
          <p class="q-ask">${esc(q.ask)}</p>
          <div class="opts">${options(q, a)}</div>
        </article>
        <aside class="q-side">
          ${a.outcome ? resultPanel(s, q, a) : controlPanel(a)}
        </aside>
      </section>`;
  }

  function mount(root, s) {
    const timerRoot = root.querySelector('[data-timer-root]');
    if (timerRoot) MS.timer.mount(timerRoot);

    root.querySelectorAll('[data-clamp-box]').forEach((box) => {
      const body = box.querySelector('[data-clamp]');
      const more = box.querySelector('.more');
      more.hidden = body.scrollHeight <= body.clientHeight + 2;
    });
  }

  function toggleClamp(btn) {
    const box = btn.closest('[data-clamp-box]');
    const open = box.classList.toggle('is-open');
    btn.querySelector('span').textContent = open ? 'Yig‘ish' : 'Batafsil';
  }

  MS.screens = MS.screens || {};
  MS.screens.question = { render, mount, toggleClamp };
})(window.MS);

/* js/screens/results.js */
/* Natijalar: reyting va tanlangan jamoa statistikasi. */
(function (MS) {
  'use strict';

  const { esc, money } = MS.dom;
  const ui = { pick: null, confirmReset: false };

  function ranked(s) {
    return s.teams
      .map((t, i) => Object.assign({ index: i }, t))
      .sort((a, b) => b.balance - a.balance || b.correct - a.correct);
  }

  function render(s) {
    const list = ranked(s);
    const pick = list.find((t) => t.index === ui.pick) || list[0];
    const isTop = pick === list[0];
    const label = isTop ? (s.finished ? 'G‘olib jamoa' : 'Yetakchi jamoa') : `${list.indexOf(pick) + 1}-o‘rin`;
    const played = pick.correct + pick.wrong + pick.skipped;
    const acc = pick.correct + pick.wrong ? Math.round((pick.correct / (pick.correct + pick.wrong)) * 100) : 0;

    const rows = list.map((t, i) => `
      <li>
        <button class="rank${t.index === pick.index ? ' is-on' : ''}" data-action="pick-team" data-index="${t.index}">
          <span class="rank__pos">${i + 1}</span>
          <span class="rank__name">${esc(t.name)}</span>
          <span class="rank__stats"><span class="ok">${MS.icon('check')}${t.correct}</span><span class="bad">${MS.icon('x')}${t.wrong}</span></span>
          <span class="rank__balance${t.balance < 0 ? ' is-neg' : ''}">${money(t.balance)}</span>
        </button>
      </li>`).join('');

    const resetBtn = ui.confirmReset
      ? `<button class="btn btn--danger" data-action="reset-confirm">${MS.icon('refresh')}<span>Ha, yangi o‘yin boshlansin</span></button>
         <button class="btn btn--ghost" data-action="reset-cancel">Bekor qilish</button>`
      : `<button class="btn btn--ghost" data-action="reset-ask">${MS.icon('refresh')}<span>Yangi o‘yin</span></button>`;

    return `
      <section class="results">
        ${s.finished ? `<p class="results__done">${MS.icon('trophy')}<span>O‘yin yakunlandi</span></p>` : ''}
        <div class="hero">
          <div class="hero__main">
            <span class="hero__label">${label}</span>
            <span class="hero__name">${esc(pick.name)}</span>
            <span class="hero__balance">${money(pick.balance)}</span>
          </div>
          <dl class="hero__stats">
            <div><dt>O‘ynagan savollar</dt><dd>${played}</dd></div>
            <div><dt>To‘g‘ri</dt><dd>${pick.correct}</dd></div>
            <div><dt>Noto‘g‘ri</dt><dd>${pick.wrong}</dd></div>
            <div><dt>Aniqlik</dt><dd>${acc}%</dd></div>
          </dl>
        </div>
        <ol class="ranking">${rows}</ol>
        <div class="results__actions">${resetBtn}</div>
      </section>`;
  }

  MS.screens = MS.screens || {};
  MS.screens.results = {
    render,
    pick(i) { ui.pick = i; },
    askReset(v) { ui.confirmReset = v; },
    clear() { ui.pick = null; ui.confirmReset = false; }
  };
})(window.MS);

/* js/app.js */
/* Ilova: ekranlarni chizish, tugmalar va klaviatura. */
(function (MS) {
  'use strict';

  const S = MS.screens;
  const store = MS.store;
  const A = store.actions;
  const app = document.getElementById('app');
  let lastKey = '';

  /* ---------- chizish ---------- */
  function render() {
    const s = store.get();

    if (s.phase === 'setup') {
      lastKey = 'setup';
      app.className = 'app app--setup';
      app.innerHTML = S.setup.render();
      S.setup.mount(app);
      return;
    }

    const key = s.phase + ':' + (s.active ? s.active.qid : '');
    const prev = app.querySelector('.stage');
    const keepScroll = key === lastKey && prev ? prev.scrollTop : 0;

    const main = s.phase === 'board' ? S.board.render(s)
      : s.phase === 'question' ? S.question.render(s)
      : S.results.render(s);

    app.className = 'app app--game';
    app.innerHTML = `${S.shell.header(s)}
      <div class="layout">
        <main class="stage${key !== lastKey ? ' enter' : ''}">${main}</main>
        ${S.shell.teams(s)}
      </div>`;

    const stage = app.querySelector('.stage');
    if (keepScroll) stage.scrollTop = keepScroll;
    if (s.phase === 'question') S.question.mount(app, s);
    lastKey = key;
  }

  /* ---------- amallar ---------- */
  function prepareTimer() {
    const a = store.get().active;
    const found = a && MS.registry.find(a.qid);
    MS.timer.prepare(MS.timer.durationFor(found ? found.q.value : 0));
  }

  const handlers = {
    'team-count': (el) => { S.setup.setCount(Number(el.dataset.n)); render(); },
    open: (el) => { A.openQuestion(el.dataset.qid); prepareTimer(); },
    'close-question': () => { MS.timer.freeze(); A.closeQuestion(); },
    select: (el) => A.select(el.dataset.letter),
    confirm: () => { MS.timer.freeze(); A.confirm(); },
    skip: () => { MS.timer.freeze(); A.skip(); },
    undo: () => A.undo(),
    next: () => A.next(),
    'show-results': () => { S.results.clear(); A.showResults(); },
    'back-board': () => A.backToBoard(),
    'pick-team': (el) => { S.results.pick(Number(el.dataset.index)); render(); },
    'reset-ask': () => { S.results.askReset(true); render(); },
    'reset-cancel': () => { S.results.askReset(false); render(); },
    'reset-confirm': () => { S.results.clear(); MS.timer.prepare(MS.config.timer.short); A.reset(); },
    'timer-toggle': () => MS.timer.toggle(),
    'timer-set': (el) => MS.timer.setDuration(Number(el.dataset.sec)),
    'timer-reset': () => MS.timer.reset(),
    expand: (el) => S.question.toggleClamp(el),
    fullscreen: () => {
      const d = document;
      try {
        if (d.fullscreenElement) d.exitFullscreen();
        else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {});
      } catch (e) { /* to'liq ekran qo'llab-quvvatlanmaydi */ }
    }
  };

  app.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled || !app.contains(el)) return;
    const fn = handlers[el.dataset.action];
    if (fn) fn(el);
  });

  /* ---------- klaviatura (moderator uchun) ----------
     1/2/3 yoki A/B/C — variant, Enter — tasdiqlash / keyingi,
     Probel — taymer, Esc — taxtaga qaytish */
  const KEY_LETTER = { 1: 'A', 2: 'B', 3: 'C', a: 'A', b: 'B', c: 'C' };

  document.addEventListener('keydown', (e) => {
    const s = store.get();
    if (s.phase !== 'question' || e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    const a = s.active;
    const k = e.key.toLowerCase();

    if (KEY_LETTER[k] && !a.outcome) { A.select(KEY_LETTER[k]); return; }
    if (k === 'enter') {
      e.preventDefault();
      if (a.outcome) A.next();
      else if (a.selected) handlers.confirm();
      return;
    }
    if (k === ' ' && !a.outcome) { e.preventDefault(); MS.timer.toggle(); return; }
    if (k === 'escape' && !a.outcome) handlers['close-question']();
  });

  /* ---------- ishga tushirish ---------- */
  store.subscribe(render);
  A.init();
  if (store.get().phase === 'question') prepareTimer();
  render();
})(window.MS);

</script>
